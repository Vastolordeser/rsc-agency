{% extends 'admin_panel/base.html' %}
{% load static %}

{% block title %}Добавление клиента | RSC Admin{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/admin_panel/clients/form.css' %}">
{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <div class="form-title">
            <i class="fas fa-user-plus"></i> Добавление клиента
        </div>
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label><i class="fas fa-user"></i> Имя *</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email *</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-phone"></i> Телефон *</label>
                <input type="tel" name="phone" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-building"></i> Компания</label>
                <input type="text" name="company">
            </div>
            <div class="form-group">
                <label><i class="fas fa-map-marker-alt"></i> Адрес</label>
                <textarea name="address" rows="2"></textarea>
            </div>
            <div class="form-group">
                <label><i class="fas fa-sticky-note"></i> Заметки</label>
                <textarea name="notes" rows="3"></textarea>
            </div>
            <div class="button-group">
                <button type="submit" class="btn-submit"><i class="fas fa-save"></i> Сохранить</button>
                <a href="{% url 'admin_clients' %}" class="btn-cancel"><i class="fas fa-times"></i> Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/admin_panel/clients/form.js' %}"></script>
{% endblock %}
